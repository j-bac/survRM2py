[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "survrm2py"
dynamic = ["version"]
description = "Python translation of survRM2 for Restricted Mean Survival Time (RMST) analysis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Jonathan Bac", email = "36225255+j-bac@users.noreply.github.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "statsmodels>=0.13",
    "patsy>=0.5",
    "scipy>=1.7",
    "lifelines>=0.27"
, "survrm2py>=0.1.2,<0.2"]

[tool.hatch.version]
path = "src/survrm2py/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/survrm2py"]

### pixi configuration ###
[tool.pixi.workspace]
name = "survrm2py"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.9"
numpy = ">=1.20"
pandas = ">=1.3"
statsmodels = ">=0.13"
patsy = ">=0.5"
scipy = ">=1.7"
ipykernel = ">=7.2.0,<8"

[tool.pixi.feature.test.dependencies]
pytest = ">=7.0"
rpy2 = ">=3.5"
r-base = ">=4.0"
r-survival = "*"
python-build = "*"

[tool.pixi.tasks]
setup-r = "Rscript -e 'if (!requireNamespace(\"survRM2\", quietly = TRUE)) install.packages(\"survRM2\", repos = \"https://cloud.r-project.org\")'"

build = "python -m build"

[tool.pixi.tasks.test]
cmd = "PYTHONPATH=src pytest -v"
depends-on = ["setup-r"]

[tool.pixi.environments]
default = { solve-group = "default" }
test = ["test"]

[dependency-groups]
test = ["survrm2py>=0.1.1,<0.2"]
