name: Publish to PyPI and Conda

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.5
        with:
          pixi-version: v0.68.0
          cache: true
          
      - name: Run tests
        run: pixi run -e test test

  publish-pypi:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install build
        run: pip install build
        
      - name: Build package
        run: python -m build
        
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-conda:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.0
        with:
          pixi-version: v0.18.0
          cache: true
          
      - name: Build Conda Package
        run: |
          pixi global install rattler-build
          rattler-build build --recipe recipe/recipe.yaml
